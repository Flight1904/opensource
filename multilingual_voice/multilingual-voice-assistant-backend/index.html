<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilingual Voice Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Multilingual Voice Assistant</h1>
    
    <div class="language-selection">
      <label for="inputLanguageSelect">Input Language:</label>
      <select id="inputLanguageSelect" class="dropdown">
        <option value="en-US">English</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
        <option value="hi-IN">Hindi</option>
        <option value="zh-CN">Chinese</option>
      </select>
    </div>

    <div class="language-selection">
      <label for="outputLanguageSelect">Translate To:</label>
      <select id="outputLanguageSelect" class="dropdown">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="hi">Hindi</option>
        <option value="zh">Chinese</option>
      </select>
    </div>

    <button id="startBtn">Start Listening</button>
    <p id="transcript">Transcript: <span id="speechOutput"></span></p>
    <p id="translation">Translation: <span id="translationOutput"></span></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
